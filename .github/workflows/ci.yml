name: Test on different platforms
on: [push]
jobs:
  test_windows:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            action_env: 'NONE'
          - os: windows-latest
            compiler: mingw
            action_env: 'MW_MINGW64_LOC="C:\ProgramData\mingw64\mingw64'
          - os: windows-latest
            compiler: mvsc
            action_env: 'PROGRAMFILES(X86)="C:\ProgramFiles (x86)"'
          - os: macos-latest
            compiler: xcode
            action_env: 'NONE'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: egor-tensin/setup-mingw@v3
        if: matrix.compiler == 'mingw'
      - uses: bazel-contrib/setup-bazel@0.19.0
      - uses: matlab-actions/setup-matlab@v3
        with:
          cache: true
      - name: Build all targets
        run: 'bazel build --action_env=${{ matrix.action_env }} //...'
      - name: Verify MEX output
        uses: matlab-actions/run-command@v3
        with:
          command: cd bazel-bin/tests; greetings
