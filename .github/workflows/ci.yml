name: Test on different platforms
on: [push]
jobs:
  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install supported compiler for Windows
        if: matrix.os == 'windows-latest'
        id: setup-mingw
        uses: egor-tensin/setup-mingw@v3
      - name: Set MinGW location on Windows
        if: matrix.os == 'windows-latest'
        run: |
          echo "MW_MINGW64_LOC=${{ steps.setup-mingw.outputs.gcc }}" >> $GITHUB_OUTPUT
      - uses: bazel-contrib/setup-bazel@0.19.0
      - uses: matlab-actions/setup-matlab@v3
      - name: Build all targets
        run: 'bazel build //...'
      - name: Verify MEX output
        uses: matlab-actions/run-command@v3
        with:
          command: cd bazel-bin/tests; greetings
